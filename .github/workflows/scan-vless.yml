name: Scan VLESS configs from raw URL

on:
  workflow_dispatch:
    inputs:
      config_url:
        description: 'Raw URL of text file containing vless:// links (one per line)'
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install ws

      - name: Run scanner
        run: node scan.js "${{ github.event.inputs.config_url }}"

      - name: Upload working configs
        uses: actions/upload-artifact@v4
        with:
          name: working-configs
          path: working.json
